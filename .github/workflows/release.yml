name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Preview without making changes"
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Prepare release
    if: github.event_name == 'push' || inputs.dry_run || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      dry_run: ${{ steps.release_meta.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release
        id: release_meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_TRIGGER=true
            DRY_RUN=false
          else
            VERSION="$INPUT_VERSION"
            TAG_TRIGGER=false
            DRY_RUN="$INPUT_DRY_RUN"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          if [[ "$TAG_TRIGGER" == "false" && "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Non-dry-run releases must run from main"
            exit 1
          fi
          if [[ "$TAG_TRIGGER" == "false" ]] && git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            git fetch origin main develop --tags
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ||
                  "$(git rev-parse HEAD)" != "$(git rev-parse origin/develop)" ]]; then
              echo "::error::release ref, main, and develop must point to the same commit before releasing"
              exit 1
            fi
          fi
          DATE=$(date -u +%Y-%m-%d)
          PREVIOUS_TAG=$(git tag --sort=-v:refname | awk -v current="v$VERSION" '$0 != current { print; exit }')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "TAG_TRIGGER=$TAG_TRIGGER" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog and release notes
        shell: bash
        run: |
          python tools/release_changelog.py \
            --version "$VERSION" \
            --date "$DATE" \
            --repository "${{ github.repository }}" \
            --output /tmp/CHANGELOG.md \
            --notes /tmp/release_body.md
          echo "Release notes:"
          cat /tmp/release_body.md

      - name: Preview
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          echo "=== Dry Run ==="
          echo "Ref: $GITHUB_REF"
          echo "Version: $VERSION"
          echo "Tag: v$VERSION"
          echo "Date: $DATE"
          echo
          echo "=== Current versions ==="
          grep -F 'project(spark VERSION ' CMakeLists.txt
          grep -F 'inline constexpr const char *kVersion = ' src/spark_constants.h
          grep -F 'ENDSTONE_PLUGIN("spark", ' src/plugin.cpp
          echo
          echo "=== Versions after update ==="
          echo "project(spark VERSION $VERSION LANGUAGES CXX)"
          echo "inline constexpr const char *kVersion = \"$VERSION\";"
          echo "ENDSTONE_PLUGIN(\"spark\", \"$VERSION\", SparkPlugin)"
          echo
          echo "=== Changelog changes ==="
          diff -u CHANGELOG.md /tmp/CHANGELOG.md || true
          echo
          echo "=== Release notes ==="
          cat /tmp/release_body.md

      - name: Update release files
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          sed -E -i "s/^project\(spark VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES CXX\)$/project(spark VERSION $VERSION LANGUAGES CXX)/" CMakeLists.txt
          sed -E -i "s/^inline constexpr const char \*kVersion = \"[0-9]+\.[0-9]+\.[0-9]+\";/inline constexpr const char *kVersion = \"$VERSION\";/" src/spark_constants.h
          sed -E -i "s/ENDSTONE_PLUGIN\(\"spark\", \"[0-9]+\.[0-9]+\.[0-9]+\", SparkPlugin\)/ENDSTONE_PLUGIN(\"spark\", \"$VERSION\", SparkPlugin)/" src/plugin.cpp
          cp /tmp/CHANGELOG.md CHANGELOG.md

      - name: Verify versions
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          grep -Fx "project(spark VERSION $VERSION LANGUAGES CXX)" CMakeLists.txt
          grep -Fx "inline constexpr const char *kVersion = \"$VERSION\";" src/spark_constants.h
          grep -Fx "ENDSTONE_PLUGIN(\"spark\", \"$VERSION\", SparkPlugin)" src/plugin.cpp
          test "$(grep -Fc "## [$VERSION]" CHANGELOG.md)" -eq 1
          test "$(grep -Fc "[$VERSION]:" CHANGELOG.md)" -eq 1
          test -s /tmp/release_body.md
          git diff --check
          git diff -- CMakeLists.txt src/spark_constants.h src/plugin.cpp CHANGELOG.md

      - name: Commit and tag
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if [[ "$TAG_TRIGGER" == "false" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Non-dry-run releases must run from main"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt CHANGELOG.md src/spark_constants.h src/plugin.cpp
          git commit -m "chore: release v$VERSION"
          if [[ "$TAG_TRIGGER" == "true" ]]; then
            git tag --force "v$VERSION"
            git push --atomic origin HEAD:main HEAD:develop "+refs/tags/v$VERSION"
          else
            git tag "v$VERSION"
            git push --atomic origin HEAD:main HEAD:develop "refs/tags/v$VERSION"
          fi

      - name: Prepare final release notes
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
              "${{ github.repository }}" "$PREVIOUS_TAG" "$VERSION" >> /tmp/release_body.md
          fi

      - name: Upload release notes
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: /tmp/release_body.md
          if-no-files-found: error

  windows:
    name: Windows
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.version != ''
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Select clang-cl 20
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & "$llvmBin\clang-cl.exe" --version
          $version
          if (-not ($version | Select-String "clang version 20\.")) {
            throw "clang-cl 20 is required"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Locate Python test runtime
        shell: python {0}
        run: |
          import ctypes
          import os
          from pathlib import Path
          import sys
          import sysconfig

          if sys.version_info < (3, 12):
              raise SystemExit("Python >= 3.12 is required for native runtime tests")
          if sys.platform == "win32":
              runtime = Path(sys.base_prefix) / f"python{sys.version_info.major}{sys.version_info.minor}.dll"
          else:
              libdir = sysconfig.get_config_var("LIBDIR")
              library = sysconfig.get_config_var("LDLIBRARY")
              if not libdir or not library or ".so" not in library:
                  raise SystemExit("Selected Python has no configured shared runtime")
              runtime = Path(libdir) / library
          if not runtime.is_file():
              raise SystemExit(f"Selected Python shared runtime is missing: {runtime}")
          runtime = runtime.resolve()
          library = ctypes.CDLL(str(runtime))
          library.Py_GetVersion.restype = ctypes.c_char_p
          version = library.Py_GetVersion().decode().split()[0]
          if version != sys.version.split()[0]:
              raise SystemExit(f"Python runtime version mismatch: {version} != {sys.version.split()[0]}")
          print(f"Python test runtime: {runtime} ({version})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SPARK_TEST_LIBPYTHON={runtime}\n")

      - name: Configure
        run: cmake --preset conan-relwithdebinfo "-DSPARK_TEST_LIBPYTHON:FILEPATH=$env:SPARK_TEST_LIBPYTHON"

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $versionLine = Get-Content build/RelWithDebInfo/CMakeCache.txt | Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' }
          if ($versionLine.Count -ne 1) { throw "CMake project version is missing or ambiguous" }
          $version = $versionLine.Split('=', 2)[1]
          & pwsh -NoProfile -File tools/verify_windows_artifacts.ps1 `
            -Dll build/RelWithDebInfo/endstone_spark.dll `
            -Pdb build/RelWithDebInfo/endstone_spark.pdb `
            -Version $version `
            -ManifestPath build/RelWithDebInfo/SHA256SUMS `
            -WriteManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            build/RelWithDebInfo/endstone_spark.dll
            build/RelWithDebInfo/endstone_spark.pdb
            build/RelWithDebInfo/SHA256SUMS
          if-no-files-found: error

  linux:
    name: Linux
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install Clang 20
        shell: bash
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang --version | grep -E "clang version 20\\."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Locate Python test runtime
        shell: python {0}
        run: |
          import ctypes
          import os
          from pathlib import Path
          import sys
          import sysconfig

          if sys.version_info < (3, 12):
              raise SystemExit("Python >= 3.12 is required for native runtime tests")
          if sys.platform == "win32":
              runtime = Path(sys.base_prefix) / f"python{sys.version_info.major}{sys.version_info.minor}.dll"
          else:
              libdir = sysconfig.get_config_var("LIBDIR")
              library = sysconfig.get_config_var("LDLIBRARY")
              if not libdir or not library or ".so" not in library:
                  raise SystemExit("Selected Python has no configured shared runtime")
              runtime = Path(libdir) / library
          if not runtime.is_file():
              raise SystemExit(f"Selected Python shared runtime is missing: {runtime}")
          runtime = runtime.resolve()
          library = ctypes.CDLL(str(runtime))
          library.Py_GetVersion.restype = ctypes.c_char_p
          version = library.Py_GetVersion().decode().split()[0]
          if version != sys.version.split()[0]:
              raise SystemExit(f"Python runtime version mismatch: {version} != {sys.version.split()[0]}")
          print(f"Python test runtime: {runtime} ({version})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SPARK_TEST_LIBPYTHON={runtime}\n")

      - name: Configure
        run: cmake --preset conan-relwithdebinfo "-DSPARK_TEST_LIBPYTHON:FILEPATH=$SPARK_TEST_LIBPYTHON" "-DENDSTONE_SPARK_GATEWAY_SAMPLER_TESTS=ON"

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Run tests
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/RelWithDebInfo/endstone_spark.so
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.version != ''
    needs: [release, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Download Windows assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-windows

      - name: Download Linux asset
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: release-linux

      - name: Verify Linux ELF
        run: python tests/native/alloc/verify_linux_gateway.py elf release-linux/endstone_spark.so

      - name: Verify Windows hashes before publishing
        shell: pwsh
        run: |
          & pwsh -NoProfile -File tools/verify_windows_artifacts.ps1 `
            -Dll release-windows/endstone_spark.dll `
            -Pdb release-windows/endstone_spark.pdb `
            -ManifestPath release-windows/SHA256SUMS `
            -VerifyHashesOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f release-notes/release_body.md
          test -f release-windows/endstone_spark.dll
          test -f release-windows/endstone_spark.pdb
          test -f release-windows/SHA256SUMS
          test -f release-linux/endstone_spark.so
          gh release create "v${{ needs.release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.release.outputs.version }}" \
            --notes-file release-notes/release_body.md \
            release-windows/endstone_spark.dll \
            release-windows/endstone_spark.pdb \
            release-linux/endstone_spark.so
