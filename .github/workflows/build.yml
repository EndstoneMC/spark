name: Build

on:
  push:
    branches: [develop, "ci/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Build & test Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20 clang-tidy-20 libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang --version | grep -E "clang version 20\\."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Test Python tooling
        run: |
          python tests/test_release_changelog.py
          python tests/test_profile_evaluator.py
          python tests/test_architecture_boundaries.py
          python tests/test_clang_tidy.py

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Locate Python test runtime
        shell: python {0}
        run: |
          import ctypes
          import os
          from pathlib import Path
          import sys
          import sysconfig

          if sys.version_info < (3, 12):
              raise SystemExit("Python >= 3.12 is required for native runtime tests")
          if sys.platform == "win32":
              runtime = Path(sys.base_prefix) / f"python{sys.version_info.major}{sys.version_info.minor}.dll"
          else:
              libdir = sysconfig.get_config_var("LIBDIR")
              library = sysconfig.get_config_var("LDLIBRARY")
              if not libdir or not library or ".so" not in library:
                  raise SystemExit("Selected Python has no configured shared runtime")
              runtime = Path(libdir) / library
          if not runtime.is_file():
              raise SystemExit(f"Selected Python shared runtime is missing: {runtime}")
          runtime = runtime.resolve()
          library = ctypes.CDLL(str(runtime))
          library.Py_GetVersion.restype = ctypes.c_char_p
          version = library.Py_GetVersion().decode().split()[0]
          if version != sys.version.split()[0]:
              raise SystemExit(f"Python runtime version mismatch: {version} != {sys.version.split()[0]}")
          print(f"Python test runtime: {runtime} ({version})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SPARK_TEST_LIBPYTHON={runtime}\n")

      - name: Configure
        run: cmake --preset conan-relwithdebinfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DSPARK_TEST_LIBPYTHON:FILEPATH=$SPARK_TEST_LIBPYTHON" "-DENDSTONE_SPARK_GATEWAY_SAMPLER_TESTS=ON"

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Run tests
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format-20 --dry-run --Werror

      - name: Upload test artifact
        uses: actions/upload-artifact@v7
        with:
          name: spark-linux-${{ github.run_id }}
          path: build/RelWithDebInfo/endstone_spark.so
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build & test Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Select clang-cl 20
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & "$llvmBin\clang-cl.exe" --version
          $version
          if (-not ($version | Select-String "clang version 20\.")) {
            throw "clang-cl 20 is required"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Windows artifact verifier
        run: |
          Get-Command pwsh, clang-cl, llvm-rc, lld-link, llvm-readobj, llvm-pdbutil -ErrorAction Stop | Out-Null
          python tests/test_windows_artifact_verifier.py

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Locate Python test runtime
        shell: python {0}
        run: |
          import ctypes
          import os
          from pathlib import Path
          import sys
          import sysconfig

          if sys.version_info < (3, 12):
              raise SystemExit("Python >= 3.12 is required for native runtime tests")
          if sys.platform == "win32":
              runtime = Path(sys.base_prefix) / f"python{sys.version_info.major}{sys.version_info.minor}.dll"
          else:
              libdir = sysconfig.get_config_var("LIBDIR")
              library = sysconfig.get_config_var("LDLIBRARY")
              if not libdir or not library or ".so" not in library:
                  raise SystemExit("Selected Python has no configured shared runtime")
              runtime = Path(libdir) / library
          if not runtime.is_file():
              raise SystemExit(f"Selected Python shared runtime is missing: {runtime}")
          runtime = runtime.resolve()
          library = ctypes.CDLL(str(runtime))
          library.Py_GetVersion.restype = ctypes.c_char_p
          version = library.Py_GetVersion().decode().split()[0]
          if version != sys.version.split()[0]:
              raise SystemExit(f"Python runtime version mismatch: {version} != {sys.version.split()[0]}")
          print(f"Python test runtime: {runtime} ({version})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SPARK_TEST_LIBPYTHON={runtime}\n")

      - name: Configure
        run: cmake --preset conan-relwithdebinfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DSPARK_TEST_LIBPYTHON:FILEPATH=$env:SPARK_TEST_LIBPYTHON"

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $versionLine = Get-Content build/RelWithDebInfo/CMakeCache.txt | Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' }
          if ($versionLine.Count -ne 1) { throw "CMake project version is missing or ambiguous" }
          $version = $versionLine.Split('=', 2)[1]
          & pwsh -NoProfile -File tools/verify_windows_artifacts.ps1 `
            -Dll build/RelWithDebInfo/endstone_spark.dll `
            -Pdb build/RelWithDebInfo/endstone_spark.pdb `
            -Version $version `
            -ManifestPath build/RelWithDebInfo/SHA256SUMS `
            -WriteManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.cpp' '*.h'
          & clang-format --dry-run --Werror $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spark-windows-${{ github.run_id }}
          path: |
            build/RelWithDebInfo/endstone_spark.dll
            build/RelWithDebInfo/endstone_spark.pdb
            build/RelWithDebInfo/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  clang-tidy-linux:
    name: Clang-tidy Linux (${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [core, native, application, tests-core, selftest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-tidy-20 libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang --version | grep -E "clang version 20\\."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: >-
          cmake --preset conan-relwithdebinfo
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES:BOOL=OFF
          "-DENDSTONE_SPARK_GATEWAY_SAMPLER_TESTS=ON"

      - name: Run clang-tidy shard
        run: python tools/run_clang_tidy.py --build-dir build/RelWithDebInfo --clang-tidy clang-tidy-20 --shard ${{ matrix.shard }}

  clang-tidy-windows:
    name: Clang-tidy Windows (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, native, application, tests-core, selftest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Select clang-cl 20
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & "$llvmBin\clang-cl.exe" --version
          $version
          if (-not ($version | Select-String "clang version 20\.")) {
            throw "clang-cl 20 is required"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: >-
          cmake --preset conan-relwithdebinfo
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES:BOOL=OFF

      - name: Run clang-tidy shard
        run: python tools/run_clang_tidy.py --build-dir build/RelWithDebInfo --clang-tidy clang-tidy --shard ${{ matrix.shard }}
